<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAF7FB">
  <title>Maisie Me Profile Concept</title>
  <style>
    @font-face {
      font-family: "DM Sans";
      src: url("../node_modules/@fontsource/dm-sans/files/dm-sans-latin-400-normal.woff2") format("woff2");
      font-weight: 400;
    }
    @font-face {
      font-family: "DM Sans";
      src: url("../node_modules/@fontsource/dm-sans/files/dm-sans-latin-500-normal.woff2") format("woff2");
      font-weight: 500;
    }
    @font-face {
      font-family: "DM Sans";
      src: url("../node_modules/@fontsource/dm-sans/files/dm-sans-latin-700-normal.woff2") format("woff2");
      font-weight: 700;
    }
    @font-face {
      font-family: "Fraunces";
      src: url("../node_modules/@fontsource/fraunces/files/fraunces-latin-600-normal.woff2") format("woff2");
      font-weight: 600;
    }

    :root {
      --plum-900: #3F0824;
      --plum-700: #713666;
      --rose: #EB587B;
      --lavender: #C8AAD9;
      --lavender-100: #F3EDF7;
      --lavender-50: #FAF7FB;
      --sage-700: #4E7554;
      --sage-400: #A9C7AB;
      --sage-100: #E9F1EA;
      --secondary: #5E3A55;
      --muted: #6B4C63;
      --surface: #FFFFFF;
      --line: rgba(63, 8, 36, 0.11);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "DM Sans", system-ui, sans-serif;
      color: var(--plum-900);
      background: #2c292e;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; }
    button:focus-visible { outline: 3px solid rgba(113, 54, 102, 0.28); outline-offset: 2px; }

    .app {
      width: min(100%, 430px);
      min-height: 100dvh;
      height: 100dvh;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      background: var(--lavender-50);
      box-shadow: 0 18px 60px rgba(0,0,0,0.3);
    }
    .scroll {
      height: 100%;
      overflow-y: auto;
      padding: calc(22px + var(--safe-top)) 20px calc(106px + var(--safe-bottom));
      overscroll-behavior-y: contain;
    }
    h1, h2, h3 { font-family: "Fraunces", Georgia, serif; letter-spacing: 0; }
    h1 { margin: 0; font-size: 31px; line-height: 1.15; }
    h2 { margin: 0; font-size: 20px; line-height: 1.25; }
    p { margin: 0; }

    .identity {
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr) 42px;
      align-items: center;
      gap: 13px;
      margin-top: 24px;
    }
    .avatar {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: 0 6px 18px rgba(63,8,36,0.06);
      color: var(--plum-700);
      font-family: "Fraunces", Georgia, serif;
      font-size: 23px;
      font-weight: 600;
    }
    .identity h2 { font-size: 21px; }
    .identity p { margin-top: 3px; color: var(--muted); font-size: 13px; }
    .icon-button {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--surface);
      display: grid;
      place-items: center;
      color: var(--plum-700);
      font-size: 20px;
    }

    .section { margin-top: 27px; }
    .section-label {
      margin: 0 0 9px 3px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .list {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: 0 7px 24px rgba(63,8,36,0.045);
    }
    .row {
      width: 100%;
      min-height: 68px;
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) auto 18px;
      align-items: center;
      gap: 10px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      padding: 11px 13px;
      text-align: left;
    }
    .row:last-child { border-bottom: 0; }
    .row:active { background: var(--lavender-100); }
    .row-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: var(--lavender-100);
      color: var(--plum-700);
    }
    .row-icon.sage { background: var(--sage-100); color: var(--sage-700); }
    .phosphor-icon {
      width: 21px;
      height: 21px;
      display: block;
      fill: currentColor;
    }
    .icon-button .phosphor-icon { width: 20px; height: 20px; }
    .row-copy strong { display: block; font-size: 14.5px; line-height: 1.3; }
    .row-copy span { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; line-height: 1.35; }
    .row-value { color: var(--muted); font-size: 12px; text-align: right; white-space: nowrap; }
    .status-value {
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--sage-100);
      color: var(--sage-700);
      font-size: 11px;
      font-weight: 700;
    }
    .chevron { color: var(--muted); font-size: 22px; line-height: 1; }

    .privacy-note {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      gap: 10px;
      margin-top: 24px;
      padding: 14px;
      border-radius: 14px;
      background: var(--lavender-100);
      color: var(--secondary);
      font-size: 12.5px;
      line-height: 1.5;
    }
    .privacy-note strong { color: var(--plum-700); }
    .privacy-mark {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--surface);
      display: grid;
      place-items: center;
      color: var(--plum-700);
      font-weight: 700;
    }

    .tabbar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 8px 8px calc(8px + var(--safe-bottom));
      border-top: 1px solid var(--line);
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(16px);
    }
    .tab {
      min-height: 54px;
      border: 0;
      background: transparent;
      border-radius: 12px;
      color: var(--muted);
      display: grid;
      place-items: center;
      align-content: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 700;
    }
    .tab-icon { width: 22px; height: 22px; fill: currentColor; }
    .tab.active { color: var(--plum-700); }
    .tab.active .tab-icon { color: var(--rose); }

    .scrim {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: flex-end;
      background: rgba(32, 14, 26, 0.44);
    }
    .scrim.open { display: flex; }
    .sheet {
      width: 100%;
      max-height: 82%;
      overflow-y: auto;
      padding: 9px 20px calc(24px + var(--safe-bottom));
      border-radius: 20px 20px 0 0;
      background: var(--surface);
      box-shadow: 0 -16px 40px rgba(32,14,26,0.18);
      animation: slide-up 180ms ease-out;
    }
    @keyframes slide-up { from { transform: translateY(25px); opacity: 0; } }
    .grabber { width: 38px; height: 4px; margin: 0 auto 14px; border-radius: 4px; background: rgba(63,8,36,0.18); }
    .sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
    .close {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: var(--lavender-100);
      color: var(--plum-700);
      font-size: 22px;
    }
    .sheet-intro { margin-top: 7px; color: var(--secondary); font-size: 13.5px; line-height: 1.5; }
    .sheet-list { margin-top: 20px; display: grid; gap: 10px; }
    .toggle-row {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }
    .toggle-row:last-child { border-bottom: 0; }
    .toggle-row strong { font-size: 14px; }
    .toggle-row span { display: block; margin-top: 2px; color: var(--muted); font-size: 11.5px; }
    .switch {
      width: 48px;
      height: 30px;
      flex: 0 0 auto;
      position: relative;
      border: 0;
      border-radius: 30px;
      background: #ddd5da;
      transition: background 140ms ease;
    }
    .switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.18);
      transition: transform 140ms ease;
    }
    .switch[aria-checked="true"] { background: var(--plum-700); }
    .switch[aria-checked="true"]::after { transform: translateX(18px); }
    .sheet-action {
      width: 100%;
      min-height: 50px;
      margin-top: 20px;
      border: 0;
      border-radius: 14px;
      background: var(--plum-700);
      color: #fff;
      font-weight: 700;
    }
    .sheet-detail {
      margin-top: 18px;
      padding: 14px;
      border-radius: 14px;
      background: var(--sage-100);
      color: var(--secondary);
      font-size: 13px;
      line-height: 1.5;
    }

    @media (min-width: 700px) {
      body { padding: 24px 0; }
      .app { min-height: calc(100dvh - 48px); height: calc(100dvh - 48px); border-radius: 32px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>

      <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <div class="grabber" aria-hidden="true"></div>
        <div class="sheet-head">
          <h2 id="sheet-title">What I track</h2>
          <button class="close" id="close-sheet" type="button" aria-label="Close">&#215;</button>
        </div>
        <p class="sheet-intro" id="sheet-intro">Choose what appears in future check-ins. Turning something off keeps the information you already logged.</p>

  <script>
    const modules = ['Period and bleeding', 'Pain', 'Mood', 'Energy', 'Sleep', 'Skin and hair', 'Food and fuel'];
    const details = {
      profile: ['Edit profile', 'Update your name and account details.', 'Name and birthday editing would live here.'],
      account: ['Account', 'Your tracker is connected to ahoo@example.com.', 'This screen would include sign out and permanent account deletion.'],
      tips: ['Tips and preferences', 'Choose which kinds of everyday guidance you want to see.', 'This would include sleep style, student or athlete context, and a control to hide all food content.'],
      reminders: ['Check-in reminders', 'Choose whether Maisie reminds you and when.', 'Notification previews would stay private and avoid health details.'],
      birthday: ['Birthday', 'February 2010', 'Month and year use the same custom controls as onboarding.'],
      trust: ['People I trust', 'One supporter currently has access to support signals only.', 'Open the full sharing screen to invite someone, change access, or revoke it.'],
      data: ['My information', 'See what is stored and where.', 'Download your data, clear this device, or permanently delete your account and associated information.'],
      about: ['About Maisie', 'Health information for asking better questions.', 'Privacy policy, terms, source policy, medical disclaimer, and contact support would live here.']
    };
    const scrim = document.getElementById('scrim');
    const title = document.getElementById('sheet-title');
    const intro = document.getElementById('sheet-intro');
    const body = document.getElementById('sheet-body');
    const close = document.getElementById('close-sheet');

    function trackingBody() {
      return `<div class="sheet-list">${modules.map((name) => `
        <div class="toggle-row">
          <div><strong>${name}</strong><span>${name === 'Food and fuel' ? 'No calories, weight, goals, or food ratings.' : 'Included in your quick check-ins.'}</span></div>
          <button class="switch" type="button" role="switch" aria-checked="true" aria-label="${name}"></button>
        </div>`).join('')}</div><button class="sheet-action" type="button" id="done">Done</button>`;
    }

    function openSheet(kind) {
      if (kind === 'tracking') {
        title.textContent = 'What I track';
        intro.textContent = 'Choose what appears in future check-ins. Turning something off keeps the information you already logged.';
        body.innerHTML = trackingBody();
      } else {
        const item = details[kind];
        title.textContent = item[0];
        intro.textContent = item[1];
        body.innerHTML = `<div class="sheet-detail">${item[2]}</div><button class="sheet-action" type="button" id="done">Done</button>`;
      }
      scrim.classList.add('open');
      close.focus();
    }

    function closeSheet() {
      scrim.classList.remove('open');
    }

    document.querySelectorAll('[data-sheet]').forEach((button) => {
      button.addEventListener('click', () => openSheet(button.dataset.sheet));
    });
    body.addEventListener('click', (event) => {
      const control = event.target.closest('.switch');
      if (control) control.setAttribute('aria-checked', control.getAttribute('aria-checked') !== 'true');
      if (event.target.id === 'done') closeSheet();
    });
    close.addEventListener('click', closeSheet);
    scrim.addEventListener('click', (event) => { if (event.target === scrim) closeSheet(); });
    document.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeSheet(); });
  </script>
